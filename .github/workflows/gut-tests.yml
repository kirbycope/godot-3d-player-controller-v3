name: GUT Unit Tests
on: push

jobs:
  gut:
    runs-on: ubuntu-latest

    env:
      XDG_CONFIG_HOME: /tmp/godot-ci-config

    container:
      image: "barichello/godot-ci:4.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot runtime deps
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends blender libfontconfig1

      - name: Seed Godot editor settings
        shell: bash
        run: |
          set -euo pipefail

          blender_path="$(command -v blender)"
          if [ -z "$blender_path" ]; then
            echo "::error::blender not found on PATH"
            exit 1
          fi

          config_dir="$XDG_CONFIG_HOME/godot"
          mkdir -p "$config_dir"

          cat > "$config_dir/editor_settings-4.7.tres" <<EOF
[gd_resource type="EditorSettings" format=4]

[resource]
filesystem/import/blender/blender_path = "$blender_path"
filesystem/import/blender/enabled = true
EOF

      - name: Import project
        run: godot --headless --path "$PWD" --import --quit

      - name: Run Tests
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: |
          godot \
            --headless \
            -d \
            --path "$PWD" \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=.gutconfig.json \
            -gcompact_mode \
            -gexit
