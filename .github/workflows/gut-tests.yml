name: GUT Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      godot_version:
        description: Godot version to run tests with
        required: true
        default: "4.7"

jobs:
  gut:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: ${{ github.event.inputs.godot_version || '4.7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip wget

          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -O godot.zip "$url"
          unzip -q godot.zip

          GODOT_BIN="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "$PWD/$GODOT_BIN" >> "$GITHUB_PATH"

      - name: Run GUT
        shell: bash
        run: |
          set -euo pipefail
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 \
            --headless \
            -d \
            --path "$PWD" \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=res://.gutconfig.json \
            -gjunit_xml_file=gut_results.xml \
            -gexit

      - name: Upload GUT XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-results
          path: gut_results.xml
          if-no-files-found: warn