name: GUT Unit Tests

# This installs Godot rather than testing inside the barichello/godot-ci:4.7 container the addons
# here used to share. The player controller's scenes are saved by a 4.8 build and carry a unique_id
# that 4.7 cannot parse, so under 4.7 the addon's class names never register, tests/gut_pre_run.gd
# fails to compile on the first one it names ("Identifier \"Inventory\" not declared in the current
# scope"), GUT cannot instantiate its hook script and aborts the run. The job then exited zero and
# reported success while running no tests at all, which is worse than a red tick. The Pages workflow
# beside this one and the DOOM GDExtension already install the same build for the same reason.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GODOT_VERSION: 4.8-dev4

jobs:
  gut:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch the addon dependencies
        shell: bash
        run: python tools/pull_addons.py

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install Godot runtime deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1 python3-numpy

      - name: Install Blender when the project has a .blend
        shell: bash
        run: |
          set -euo pipefail
          if ! find . -name '*.blend' -not -path './.git/*' | grep -q .; then
            echo "No .blend in this repository; Godot will never reach for Blender."
            exit 0
          fi
          echo "Found a .blend; installing Blender."
          sudo apt-get install -y --no-install-recommends blender
          # Godot must be told where Blender is. Without this it fails with "Cannot configure blender
          # path in headless mode", and that error aborts the WHOLE import: no fonts, no textures, and
          # an export a tenth of its proper size.
          settings="$HOME/.config/godot/editor_settings-${GODOT_VERSION%%-*}.tres"
          mkdir -p "$(dirname "$settings")"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo 'filesystem/import/blender/blender_path = "/usr/bin/blender"'
          } > "$settings"
          blender --version | head -1

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          # One pass only registers the files; each further pass writes the resources whose
          # dependencies the previous pass produced, and this project is asset-heavy enough to need
          # several. The Pages workflow imports four times for the same reason.
          for _ in 1 2 3 4; do
            godot --headless --path "$PWD" --import
          done

      - name: Run Tests
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: |
          mkdir -p test-results
          godot \
            --headless \
            -d \
            --path "$PWD" \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=res://.gutconfig.json \
            -gjunit_xml_file=test-results/gut-junit.xml \
            -gcompact_mode \
            -gexit

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gut-test-reports
          path: test-results/
          if-no-files-found: warn
