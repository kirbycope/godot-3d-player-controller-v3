name: GUT Unit Tests
on: push

jobs:
  gut:
    runs-on: ubuntu-latest

    container:
      image: "barichello/godot-ci:4.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot runtime deps
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends blender libfontconfig1

      - name: Configure Blender path for headless import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender_path = "/usr/bin/blender"
          EOF

      - name: Import project
        run: godot --headless --path "$PWD" --import --quit

      - name: Run Tests
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: |
          godot \
            --headless \
            -d \
            --path "$PWD" \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=.gutconfig.json \
            -gcompact_mode \
            -gexit
