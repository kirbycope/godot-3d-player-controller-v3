name: GUT Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.7

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import Assets
        run: godot --headless --import --quit --path "$PWD"

      - name: Run GUT
        run: |
          godot \
            --headless \
            --path "$PWD" \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=res://.gutconfig.json \
            -gcompact_mode \
            -gexit
