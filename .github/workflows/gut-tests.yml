name: GUT Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      godot_version:
        description: Godot version to run tests with
        required: true
        default: "4.7"

jobs:
  gut:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: ${{ github.event.inputs.godot_version || '4.7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip wget

          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -O godot.zip "$url"
          unzip -q godot.zip

          GODOT_BIN_PATH="$(find "$PWD" -maxdepth 1 -type f -name 'Godot_v*-stable_linux.x86_64' | head -n1)"
          if [[ -z "$GODOT_BIN_PATH" ]]; then
            echo "Could not find extracted Godot binary"
            ls -la
            exit 1
          fi

          chmod +x "$GODOT_BIN_PATH"
          echo "GODOT_BIN_PATH=$GODOT_BIN_PATH" >> "$GITHUB_ENV"

      - name: Preflight Resource References
        shell: bash
        run: |
          set -euo pipefail

          refs_raw="$(mktemp)"
          refs="$(mktemp)"
          files_list="$(mktemp)"

          if ! find . -type f -print0 > "$files_list"; then
            echo "Resource preflight failed: unable to list project files."
            exit 1
          fi

          while IFS= read -r -d '' file; do
            case "$file" in
              *.tscn|*.tres|*.material|*.res|*.tscn.remap)
                grep -hoE 'path="res://[^"]+"' "$file" >> "$refs_raw" || true
                ;;
            esac
          done < "$files_list"

          sort -u "$refs_raw" | sed -E 's/^path="res:\/\///; s/"$//' > "$refs"

          missing=0
          while IFS= read -r rel_path; do
            [[ -z "$rel_path" ]] && continue
            [[ "$rel_path" == .godot/* ]] && continue
            if [[ ! -e "$rel_path" ]]; then
              echo "MISSING_RESOURCE: res://$rel_path"
              missing=$((missing + 1))
            fi
          done < "$refs"

          if (( missing > 0 )); then
            echo "Found $missing missing resource reference(s)."
            exit 1
          fi

          echo "Resource preflight passed: all referenced res:// paths exist."

      - name: Import Project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN_PATH" \
            --headless \
            --import \
            --path "$PWD"

      - name: Run GUT
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN_PATH" \
            --headless \
            --path "$PWD" \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=res://.gutconfig.json \
            -gjunit_xml_file=gut_results.xml \
            -gexit

      - name: Upload GUT XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-results
          path: gut_results.xml
          if-no-files-found: warn