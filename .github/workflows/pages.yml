name: Demo on Pages

# The web export is built here and handed straight to Pages. It is tens of megabytes of .wasm and .pck
# that git cannot delta, so committing it (this project used to publish a tracked docs/ folder) means a
# fresh copy of the whole export in history on every re-export. Worse, a committed export goes stale
# silently: Pages keeps deploying it successfully while the site drifts behind main.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.8-dev4
  BLENDER_VERSION: 5.2.0 # the LTS the .blend scenes were saved against

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch the addon dependencies
        shell: bash
        run: python tools/pull_addons.py

      - name: Install Godot and its export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          unzip -q templates.tpz
          # The .tpz unpacks to templates/; Godot looks for them under the version's own directory.
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}/"

      - name: Install Blender when the project has a .blend
        shell: bash
        run: |
          set -euo pipefail
          if ! find . -name '*.blend' -not -path './.git/*' | grep -q .; then
            echo "No .blend in this repository; Godot will never reach for Blender."
            exit 0
          fi
          echo "Found a .blend; installing Blender."
          # The same Blender the scenes were saved against, not Ubuntu's 4.0.2: each Blender release
          # orders an exported armature its own way, so a SpringBoneSimulator3D's saved bone indices
          # only match the armature when CI imports the .blend with the release that made them.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0
          curl -fsSL -o blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          sudo mkdir -p /opt/blender
          sudo tar -xJf blender.tar.xz -C /opt/blender --strip-components=1
          rm blender.tar.xz
          # Godot must be told where Blender is. Without this it fails with "Cannot configure blender
          # path in headless mode", and that error aborts the WHOLE import: no fonts, no textures, and
          # an export a tenth of its proper size.
          settings="$HOME/.config/godot/editor_settings-${GODOT_VERSION%%-*}.tres"
          mkdir -p "$(dirname "$settings")"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo 'filesystem/import/blender/blender_path = "/opt/blender/blender"'
          } > "$settings"
          /opt/blender/blender --version | head -1

      - name: Export the game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          # Textures are committed and imported at full resolution, so a desktop build keeps the
          # fidelity the artist shipped. The web build is the one place load time is the binding
          # constraint, so it caps the largest edge here, before the import pass that bakes it in.
          # This edits a throwaway checkout; nothing it touches is committed.
          python3 tools/web_texture_cap.py --size 512
          # Import repeatedly before exporting. One pass only registers the files; each further pass
          # writes the resources whose dependencies the previous pass produced, and this project is
          # asset-heavy enough to need several. Exporting early ships scenes whose textures were never
          # written to .godot/imported, which the browser reports as a corrupt texture.
          for _ in 1 2 3 4; do
            godot --headless --path . --import
          done
          godot --headless --path . --export-release "Web" build/index.html

      - name: Upload the export
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
